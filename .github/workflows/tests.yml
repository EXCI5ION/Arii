name: Pruebas

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python y Qt (Windows)
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: python -m pip install -e ".[dev]"

      - name: Ejecutar pruebas Python y Qt
        env:
          ARII_SKIP_R_TESTS: "1"
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  r-workers:
    name: Motor científico R (Ubuntu)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Validar instalador de servidor
        run: bash tests/test_install_server.sh

      - name: Configurar R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: "4.5.3"
          use-public-rspm: true

      - name: Instalar y almacenar dependencias de R
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::BiocManager
            any::jsonlite
            bioc::mixOmics

      - name: Instalar Arii y dependencias de prueba
        run: python -m pip install -e ".[dev]"

      - name: Mostrar versiones científicas
        run: >-
          Rscript -e "cat(R.version.string, '\n');
          cat('Bioconductor', as.character(BiocManager::version()), '\n');
          cat('mixOmics', as.character(packageVersion('mixOmics')), '\n');
          cat('jsonlite', as.character(packageVersion('jsonlite')), '\n')"

      - name: Ejecutar pruebas de workers R
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_core.py::PcaWorkerTests
